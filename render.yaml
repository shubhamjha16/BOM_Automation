# api + worker + Postgres + Redis. Migrations run as a PRE-DEPLOY command, never
# inside the web process (§10).
services:
  - type: web
    name: bom-factory-api
    runtime: python
    region: singapore
    plan: starter
    buildCommand: cd backend && pip install uv && uv sync --frozen
    preDeployCommand: cd backend && uv run alembic upgrade head
    startCommand: cd backend && uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: bom-factory-db, property: connectionString }
      - key: REDIS_URL
        fromService: { name: bom-factory-redis, type: redis, property: connectionString }
      - { key: GROQ_API_KEY, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: JWT_SECRET, generateValue: true }
      - { key: GUIDELINE_VERSION, value: "2.0" }
      - { key: GUIDELINE_DATE, value: "2025-07-09" }
      - { key: AWS_REGION, value: ap-south-1 }

  - type: worker
    name: bom-factory-worker
    runtime: python
    region: singapore
    plan: starter
    buildCommand: cd backend && pip install uv && uv sync --frozen
    startCommand: cd backend && uv run arq app.workers.arqApp.WorkerSettings
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: bom-factory-db, property: connectionString }
      - key: REDIS_URL
        fromService: { name: bom-factory-redis, type: redis, property: connectionString }
      - { key: GROQ_API_KEY, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: JWT_SECRET, sync: false }

  - type: redis
    name: bom-factory-redis
    region: singapore
    plan: starter
    ipAllowList: []

databases:
  - name: bom-factory-db
    region: singapore
    plan: basic-256mb
    postgresMajorVersion: "16"
