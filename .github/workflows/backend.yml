name: backend

# Path-filtered: the point of the monorepo. A PR touching only frontend/ does not
# run this suite.
on:
  push:
    branches: [main]
    paths: ['backend/**', 'packages/api-types/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'packages/api-types/**', '.github/workflows/backend.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: ruff
        run: uv run ruff check app tests
      - name: mypy
        run: uv run mypy app
      - name: pytest
        run: uv run pytest -q
        env:
          GROQ_API_KEY: ci-placeholder
          ANTHROPIC_API_KEY: ci-placeholder
          JWT_SECRET: ci-placeholder-that-is-at-least-32-bytes
      - name: lockfile drift
        run: uv lock --check

      # Renders the migration offline and diffs it against the models. Catches
      # schema drift with no Postgres in CI at all.
      # A backend schema change that is not reflected in packages/api-types
      # fails here, rather than surfacing as a runtime shape mismatch in the
      # console. Needs node, because the generator is a node tool.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: generated API types are current
        run: yarn install --frozen-lockfile && cd .. && make api-types-check
        working-directory: .
        env:
          GROQ_API_KEY: ci-placeholder
          ANTHROPIC_API_KEY: ci-placeholder
          JWT_SECRET: ci-placeholder-that-is-at-least-32-bytes

      - name: migration renders and matches the models
        run: uv run pytest tests/test_migrations.py tests/test_models.py -q
        env:
          GROQ_API_KEY: ci-placeholder
          ANTHROPIC_API_KEY: ci-placeholder
          JWT_SECRET: ci-placeholder-that-is-at-least-32-bytes

  # Blocking, because the failure it catches is algorithmic. A per-component cost
  # that quietly became quadratic passes every functional test and turns a client's
  # 50,000-component estate into a timeout. The budget is four times the measured
  # figure so a noisy runner does not fail the build.
  scale:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      GROQ_API_KEY: ci-placeholder
      ANTHROPIC_API_KEY: ci-placeholder
      JWT_SECRET: ci-placeholder-that-is-at-least-32-bytes
      ENRICHMENT_ONLINE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - name: 50,000-component SBOM within budget, p95 per lane
        run: uv run python -m app.scripts.scaleProfile
      # Informational. It cannot fail, because the audit it reports on is a person
      # reading a PDF — see `services/catalogue/audit.py`. It is here so the
      # unconfirmed fraction is visible on every run rather than looked up when
      # somebody remembers to.
      - name: catalogue audit worksheet
        run: uv run python -m app.services.catalogue.audit

  # A supply-chain conformance tool shipping known-vulnerable dependencies is not
  # commercially survivable. Blocking, per §10.
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      # Audits the locked dependencies, not the project itself: --strict treats
      # "bom-automation-backend is not on PyPI" as a failure, so auditing the
      # installed environment could never pass.
      - run: uv export --frozen --all-extras --no-emit-project --format requirements-txt -o audit-requirements.txt
      - run: uv run --with pip-audit pip-audit --strict --disable-pip -r audit-requirements.txt
