name: frontend

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'packages/api-types/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'packages/api-types/**', '.github/workflows/frontend.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    # src/global/env.ts refuses to load without it, and the tests import the
    # API client. Public by definition (see frontend/.env.example), never a secret.
    env:
      VITE_API_BASE_URL: http://localhost:8005/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @bom-automation/frontend lint
      - run: yarn workspace @bom-automation/frontend typecheck
      - run: yarn workspace @bom-automation/frontend test --run
      - run: yarn workspace @bom-automation/frontend build
