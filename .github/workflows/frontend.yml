name: frontend

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'packages/api-types/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'packages/api-types/**', '.github/workflows/frontend.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @bom-factory/frontend lint
      - run: yarn workspace @bom-factory/frontend typecheck
      - run: yarn workspace @bom-factory/frontend test --run
      - run: yarn workspace @bom-factory/frontend build
